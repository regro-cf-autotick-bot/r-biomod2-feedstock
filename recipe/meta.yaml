{% set version = "4.3-4-8" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-biomod2
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/biomod2_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/biomod2/biomod2_{{ version }}.tar.gz
  sha256: 3c8bd703fd84ed63f3c747efc5ffd5a28842b4ae38a840d1f87ba60cbec5002b

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-mass
    - r-presenceabsence
    - r-abind
    - r-dplyr
    - r-foreach
    - r-gbm >=2.1.3
    - r-ggplot2
    - r-proc >=1.15.0
    - r-reshape
    - r-reshape2
    - r-rlang
    - r-rpart
    - r-scales
    - r-sp
    - r-terra >=1.6_33
  run:
    - r-base
    - r-mass
    - r-presenceabsence
    - r-abind
    - r-dplyr
    - r-foreach
    - r-gbm >=2.1.3
    - r-ggplot2
    - r-proc >=1.15.0
    - r-reshape
    - r-reshape2
    - r-rlang
    - r-rpart
    - r-scales
    - r-sp
    - r-terra >=1.6_33

test:
  commands:
    - $R -e "library('biomod2')"           # [not win]
    - "\"%R%\" -e \"library('biomod2')\""  # [win]

about:
  home: https://biomodhub.github.io/biomod2/
  dev_url: https://github.com/biomodhub/biomod2
  license: GPL-3.0-only
  summary: Functions for species distribution modeling, calibration and evaluation, ensemble of models, ensemble forecasting and visualization. The package permits to run consistently up to 10 single models on a presence/absences (resp presences/pseudo-absences) dataset and to combine them in ensemble models and 
    ensemble projections. Some bench of other evaluation and visualisation tools are also available within the package.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
    - colineroyaux
